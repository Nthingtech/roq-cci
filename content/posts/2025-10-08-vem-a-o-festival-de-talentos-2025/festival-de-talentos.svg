<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Ilustração: palco com cortinas, holofote e microfone</title>
  <defs>
    <g id="curtain">
      <path d="M0,0 H150 C128,80 88,150 66,192 C80,216 92,240 102,262 H0 Z" fill="#005cbd"/>
      <g fill="none" stroke="#0050a7" stroke-width="6" stroke-linecap="round">
        <path d="M38,24 C40,90 34,150 30,190 C34,215 38,240 40,258"/>
        <path d="M90,24 C82,90 62,150 50,190 C58,215 66,240 72,258"/>
      </g>
      <ellipse cx="62" cy="194" rx="16" ry="7" fill="#ffc93c" transform="rotate(-20 62 194)"/>
    </g>
    <path id="sparkle" d="M0,-10 Q2,-2 10,0 Q2,2 0,10 Q-2,2 -10,0 Q-2,-2 0,-10 Z"/>
    <g id="note">
      <ellipse cx="0" cy="0" rx="9" ry="7" transform="rotate(-20)"/>
      <rect x="5.5" y="-38" width="3.5" height="38"/>
      <path d="M9,-38 C22,-32 26,-22 22,-12 C20,-20 16,-24 9,-26 Z"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="#001a40"/>

  <!-- holofote -->
  <polygon points="296,30 344,30 440,262 200,262" fill="#ffc93c" opacity="0.14"/>
  <ellipse cx="320" cy="262" rx="110" ry="12" fill="#ffc93c" opacity="0.3"/>

  <!-- palco -->
  <rect x="0" y="262" width="640" height="16" fill="#0050a7"/>
  <rect x="0" y="278" width="640" height="4" fill="#003a7a"/>

  <!-- microfone no pedestal -->
  <ellipse cx="320" cy="262" rx="26" ry="5" fill="#acc7ff"/>
  <line x1="320" y1="262" x2="320" y2="178" stroke="#acc7ff" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(320,176) rotate(-18)">
    <rect x="-8" y="-30" width="16" height="36" rx="7" fill="#7eabff"/>
    <circle cx="0" cy="-44" r="17" fill="#edf0ff" stroke="#acc7ff" stroke-width="3"/>
    <g stroke="#acc7ff" stroke-width="2">
      <line x1="-12" y1="-48" x2="12" y2="-48"/>
      <line x1="-12" y1="-40" x2="12" y2="-40"/>
      <line x1="0" y1="-58" x2="0" y2="-30"/>
    </g>
  </g>

  <!-- notas musicais e brilhos -->
  <use href="#note" fill="#7eabff" transform="translate(222,150)"/>
  <use href="#note" fill="#ffc93c" transform="translate(410,118) scale(0.85)"/>
  <use href="#sparkle" fill="#ffc93c" transform="translate(250,86) scale(1.2)"/>
  <use href="#sparkle" fill="#ffffff" transform="translate(392,182) scale(0.8)"/>
  <use href="#sparkle" fill="#ffffff" transform="translate(196,214) scale(0.7)"/>
  <use href="#sparkle" fill="#ffc93c" transform="translate(452,214) scale(1)"/>

  <!-- cortinas -->
  <use href="#curtain"/>
  <use href="#curtain" transform="translate(640,0) scale(-1,1)"/>
  <path d="M0,0 H640 V30 Q600,58 560,30 Q520,58 480,30 Q440,58 400,30 Q360,58 320,30 Q280,58 240,30 Q200,58 160,30 Q120,58 80,30 Q40,58 0,30 Z" fill="#0050a7"/>
  <rect x="0" y="26" width="640" height="4" fill="#ffc93c"/>

  <text x="320" y="326" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="28" fill="#ffffff">Festival de Talentos</text>
</svg>
