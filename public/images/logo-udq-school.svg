<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="home-illustration-title">
  <title id="home-illustration-title">Emblema da Udq School: escudo azul com blocos de brinquedo U, D e Q</title>

  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15ACE1"/>
      <stop offset="1" stop-color="#0050a7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="320" rx="28" fill="#11173a"/>

  <path d="M200,30 L276,56 V120 C276,168 244,196 200,214 C156,196 124,168 124,120 V56 Z"
        fill="url(#shieldGrad)" stroke="#eaf6ff" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round"/>

  <g font-family="Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="24" text-anchor="middle" fill="#001a40">
    <rect x="181" y="96" width="38" height="38" rx="6" fill="#ffc93c"/>
    <text x="200" y="124">U</text>
    <rect x="160" y="138" width="38" height="38" rx="6" fill="#eaf6ff"/>
    <text x="179" y="166">D</text>
    <rect x="202" y="138" width="38" height="38" rx="6" fill="#7eabff"/>
    <text x="221" y="166">Q</text>
  </g>

  <text x="200" y="258" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="1" fill="#ffffff">UDQ SCHOOL</text>
  <text x="200" y="284" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="12" letter-spacing="3" fill="#7eabff">EDUCAÇÃO INFANTIL</text>
</svg>
