{@io.quarkiverse.roq.frontmatter.runtime.model.DocumentPage page}

<div class="main">
    <h1>{page.title}</h1>
    {#if page.image}
    <img class="page-image" src="{page.image}" alt="{page.title}">
    {/}
    <p>{page.data.notfound_text} <a href="{site.url}">{page.data.notfound_link}</a>.</p>
</div>
